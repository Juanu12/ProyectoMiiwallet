<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Facturas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('facturas')}"></nav>

<main class="container pb-5">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Facturas</h1>
        <a class="btn btn-mw" th:href="@{/facturas/nueva}">+ Registrar factura</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="card card-mw">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr><th>Fecha</th><th>Comercio</th><th>Categoría</th><th>Método de pago</th>
                    <th class="text-end">Total</th><th class="text-end">Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:each="f : ${facturas}">
                    <td class="text-nowrap" th:text="${#temporals.format(f.fecha, 'dd/MM/yyyy')}">fecha</td>
                    <td class="fw-semibold" th:text="${f.comercio}">Comercio</td>
                    <td><span class="badge badge-mw" th:text="${f.categoriaNombre}">Cat</span></td>
                    <td class="small" th:text="${f.metodoNombre}">Efectivo</td>
                    <td class="text-end text-nowrap fw-semibold"
                        th:text="'$' + ${#numbers.formatDecimal(f.total, 1, 'POINT', 0, 'COMMA')}">$0</td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/facturas/{id}(id=${f.id})}">Ver</a>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/facturas/{id}/editar(id=${f.id})}">Editar</a>
                        <form class="d-inline" method="post" th:action="@{/facturas/{id}/eliminar(id=${f.id})}"
                              onsubmit="return confirm('¿Eliminar esta factura y sus productos?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(facturas)}">
                    <td colspan="6" class="text-center text-muted py-4">Aún no hay facturas registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
