<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('productos')}"></nav>

<main class="container pb-5" style="max-width: 720px;">
    <h1 class="h3 mb-3" th:text="${titulo}">Nuevo producto</h1>

    <div class="card card-mw">
        <div class="card-body p-4">
            <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                           th:errorclass="is-invalid" maxlength="80">
                    <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
                </div>

                <div class="mb-4">
                    <label for="idCategoria" class="form-label">Categoría</label>
                    <select id="idCategoria" class="form-select" th:field="*{idCategoria}" th:errorclass="is-invalid">
                        <option value="">Selecciona...</option>
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}">Categoría</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{idCategoria}">Error</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-mw">Guardar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/productos}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
