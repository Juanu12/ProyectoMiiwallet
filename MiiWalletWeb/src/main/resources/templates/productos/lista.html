<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('productos')}"></nav>

<main class="container pb-5" style="max-width: 860px;">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Productos</h1>
        <a class="btn btn-mw" th:href="@{/productos/nuevo}">+ Nuevo producto</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="card card-mw">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Producto</th><th>Categoría</th><th class="text-end">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td class="fw-semibold" th:text="${p.nombre}">Nombre</td>
                    <td><span class="badge badge-mw" th:text="${p.categoriaNombre}">Categoría</span></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/productos/{id}/editar(id=${p.id})}">Editar</a>
                        <form class="d-inline" method="post" th:action="@{/productos/{id}/eliminar(id=${p.id})}"
                              onsubmit="return confirm('¿Eliminar este producto?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="3" class="text-center text-muted py-4">Aún no hay productos. Crea el primero con "Nuevo producto".</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="small text-muted mt-3">Los productos se usan en el detalle de las facturas (ej.: "Dona", "Mercado del mes").</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
