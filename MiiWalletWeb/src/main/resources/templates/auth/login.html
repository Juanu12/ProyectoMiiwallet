<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="auth">

<main class="container py-5" style="max-width: 420px;">
    <div class="text-center mb-4">
        <div class="marca">Mii<span>Wallet</span></div>
        <p class="text-muted mb-0">Tu dinero, claro y ordenado.</p>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="card card-mw">
        <div class="card-body p-4">
            <h1 class="h5 mb-3">Iniciar sesión</h1>
            <form th:action="@{/login}" th:object="${form}" method="post" novalidate>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo</label>
                    <input type="email" id="correo" class="form-control" th:field="*{correo}"
                           th:errorclass="is-invalid" autocomplete="username" autofocus>
                    <div class="invalid-feedback" th:errors="*{correo}">Error</div>
                </div>
                <div class="mb-4">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" id="contrasena" class="form-control" th:field="*{contrasena}"
                           th:errorclass="is-invalid" autocomplete="current-password">
                    <div class="invalid-feedback" th:errors="*{contrasena}">Error</div>
                </div>
                <button type="submit" class="btn btn-mw w-100">Entrar</button>
            </form>
        </div>
    </div>

    <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a th:href="@{/registro}">Crea una</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
