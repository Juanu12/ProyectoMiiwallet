<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body class="auth">

<main class="container py-5" style="max-width: 420px;">
    <div class="text-center mb-4">
        <div class="marca">Mii<span>Wallet</span></div>
        <p class="text-muted mb-0">Crea tu cuenta para empezar.</p>
    </div>

    <div class="card card-mw">
        <div class="card-body p-4">
            <h1 class="h5 mb-3">Crear cuenta</h1>
            <form th:action="@{/registro}" th:object="${form}" method="post" novalidate>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo</label>
                    <input type="email" id="correo" class="form-control" th:field="*{correo}"
                           th:errorclass="is-invalid" autocomplete="username" maxlength="120" autofocus>
                    <div class="invalid-feedback" th:errors="*{correo}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" id="contrasena" class="form-control" th:field="*{contrasena}"
                           th:errorclass="is-invalid" autocomplete="new-password" maxlength="72">
                    <div class="invalid-feedback" th:errors="*{contrasena}">Error</div>
                    <div class="form-text">Mínimo 6 caracteres.</div>
                </div>
                <div class="mb-4">
                    <label for="confirmacion" class="form-label">Repite la contraseña</label>
                    <input type="password" id="confirmacion" class="form-control" th:field="*{confirmacion}"
                           th:errorclass="is-invalid" autocomplete="new-password" maxlength="72">
                    <div class="invalid-feedback" th:errors="*{confirmacion}">Error</div>
                </div>
                <button type="submit" class="btn btn-mw w-100">Crear cuenta</button>
            </form>
        </div>
    </div>

    <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
