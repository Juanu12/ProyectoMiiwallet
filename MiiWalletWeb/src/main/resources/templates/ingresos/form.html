<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('ingresos')}"></nav>

<main class="container pb-5" style="max-width: 720px;">
    <h1 class="h3 mb-3" th:text="${titulo}">Nuevo ingreso</h1>

    <div class="card card-mw">
        <div class="card-body p-4">
            <form th:action="@{/ingresos/guardar}" th:object="${ingreso}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="idTipoIngreso" class="form-label">Tipo de ingreso</label>
                    <select id="idTipoIngreso" class="form-select" th:field="*{idTipoIngreso}" th:errorclass="is-invalid">
                        <option value="">Selecciona...</option>
                        <option th:each="t : ${tipos}" th:value="${t.id}" th:text="${t.nombre}">Salario</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{idTipoIngreso}">Error</div>
                </div>

                <div class="row">
                    <div class="col-sm-6 mb-4">
                        <label for="monto" class="form-label">Monto (COP)</label>
                        <div class="input-group has-validation">
                            <span class="input-group-text">$</span>
                            <input type="number" id="monto" class="form-control" th:field="*{monto}"
                                   th:errorclass="is-invalid" min="0" step="any">
                            <div class="invalid-feedback" th:errors="*{monto}">Error</div>
                        </div>
                    </div>
                    <div class="col-sm-6 mb-4">
                        <label for="fecha" class="form-label">Fecha</label>
                        <input type="date" id="fecha" class="form-control" th:field="*{fecha}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{fecha}">Error</div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-mw">Guardar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/ingresos}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
