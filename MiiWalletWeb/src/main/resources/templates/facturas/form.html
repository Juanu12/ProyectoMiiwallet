<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('facturas')}"></nav>

<main class="container pb-5" style="max-width: 720px;">
    <h1 class="h3 mb-3" th:text="${titulo}">Nueva factura</h1>

    <div class="card card-mw">
        <div class="card-body p-4">
            <form th:action="@{/facturas/guardar}" th:object="${factura}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="comercio" class="form-label">Comercio</label>
                    <input type="text" id="comercio" class="form-control" th:field="*{comercio}"
                           th:errorclass="is-invalid" maxlength="80" placeholder="Ej.: Éxito Cabecera">
                    <div class="invalid-feedback" th:errors="*{comercio}">Error</div>
                </div>

                <div class="row">
                    <div class="col-sm-6 mb-3">
                        <label for="idCategoria" class="form-label">Categoría</label>
                        <select id="idCategoria" class="form-select" th:field="*{idCategoria}" th:errorclass="is-invalid">
                            <option value="">Selecciona...</option>
                            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}">Cat</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{idCategoria}">Error</div>
                    </div>
                    <div class="col-sm-6 mb-3">
                        <label for="idMetodo" class="form-label">Método de pago</label>
                        <select id="idMetodo" class="form-select" th:field="*{idMetodo}" th:errorclass="is-invalid">
                            <option value="">Selecciona...</option>
                            <option th:each="m : ${metodos}" th:value="${m.id}" th:text="${m.nombre}">Efectivo</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{idMetodo}">Error</div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-sm-6 mb-4">
                        <label for="fecha" class="form-label">Fecha</label>
                        <input type="date" id="fecha" class="form-control" th:field="*{fecha}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{fecha}">Error</div>
                    </div>
                    <div class="col-sm-6 mb-4">
                        <label for="total" class="form-label">Total (COP)</label>
                        <div class="input-group has-validation">
                            <span class="input-group-text">$</span>
                            <input type="number" id="total" class="form-control" th:field="*{total}"
                                   th:errorclass="is-invalid" min="0" step="any">
                            <div class="invalid-feedback" th:errors="*{total}">Error</div>
                        </div>
                        <div class="form-text">Puedes dejarlo en 0 y calcularlo luego con los productos.</div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-mw">Guardar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/facturas}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
