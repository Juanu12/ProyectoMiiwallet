<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorías')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('categorias')}"></nav>

<main class="container pb-5" style="max-width: 860px;">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Categorías</h1>
        <a class="btn btn-mw" th:href="@{/categorias/nueva}">+ Nueva categoría</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="card card-mw">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Nombre</th><th>Ámbito</th><th class="text-end">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="c : ${categorias}">
                    <td class="fw-semibold" th:text="${c.nombre}">Nombre</td>
                    <td><span class="badge badge-mw" th:text="${c.ambito}">gasto</span></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/categorias/{id}/editar(id=${c.id})}">Editar</a>
                        <form class="d-inline" method="post" th:action="@{/categorias/{id}/eliminar(id=${c.id})}"
                              onsubmit="return confirm('¿Eliminar esta categoría?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(categorias)}">
                    <td colspan="3" class="text-center text-muted py-4">Aún no hay categorías.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="small text-muted mt-3">Ámbito: dónde se puede usar la categoría (gasto, ingreso o general = ambos).</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
