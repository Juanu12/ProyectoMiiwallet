spring.application.name=miiwallet
server.port=8080

# Base de datos SQLite: el archivo gestion_financiera.db de MiiWallet.
# foreign_keys=true activa las llaves foraneas (SQLite las trae apagadas por defecto).
spring.datasource.url=jdbc:sqlite:${MIIWALLET_DB_PATH:./gestion_financiera.db}?foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite permite una sola escritura a la vez: una conexion evita errores "database is locked"
spring.datasource.hikari.maximum-pool-size=1

# Ejecuta schema.sql al arrancar (crea las tablas solo si no existen)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Para clase: los cambios en las plantillas HTML se ven al recargar la pagina
spring.thymeleaf.cache=false

# La sesion (login) se cierra sola tras 30 minutos sin actividad
server.servlet.session.timeout=30m

# SOLO PARA PRUEBAS: los usuarios de ejemplo de gestion_financiera.db tienen hashes falsos
# (ej. "hash_ana_9f3a") y no podrian entrar. Al arrancar, a esos usuarios (y solo a esos)
# se les pone esta contrasena guardada con BCrypt. Despues del primer arranque ya no hace nada.
# Borra esta linea antes de entregar o publicar la app.
miiwallet.demo-contrasena=MiiWallet123
