<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ingresos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('ingresos')}"></nav>

<main class="container pb-5" style="max-width: 860px;">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Ingresos</h1>
        <a class="btn btn-mw" th:href="@{/ingresos/nuevo}">+ Nuevo ingreso</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="card card-mw">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Fecha</th><th>Tipo</th><th class="text-end">Monto</th><th class="text-end">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="i : ${ingresos}">
                    <td class="text-nowrap" th:text="${#temporals.format(i.fecha, 'dd/MM/yyyy')}">fecha</td>
                    <td><span class="badge badge-mw" th:text="${i.tipoNombre}">Salario</span></td>
                    <td class="text-end text-nowrap fw-semibold positivo"
                        th:text="'$' + ${#numbers.formatDecimal(i.monto, 1, 'POINT', 0, 'COMMA')}">$0</td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/ingresos/{id}/editar(id=${i.id})}">Editar</a>
                        <form class="d-inline" method="post" th:action="@{/ingresos/{id}/eliminar(id=${i.id})}"
                              onsubmit="return confirm('¿Eliminar este ingreso?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ingresos)}">
                    <td colspan="4" class="text-center text-muted py-4">Aún no hay ingresos registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
