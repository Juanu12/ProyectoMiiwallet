<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Partes comunes que reutilizan todas las paginas: head, barra superior y mensajes -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · MiiWallet'">MiiWallet</title>
    <!-- Bootstrap 5 desde CDN (se necesita internet en el navegador) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>

<body>

<!-- activo = nombre de la seccion actual, para resaltar el enlace del menu -->
<nav th:fragment="navbar(activo)" class="navbar navbar-expand-md navbar-mw navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Mii<span>Wallet</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'inicio'} ? 'active'"
                                        th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'ingresos'} ? 'active'"
                                        th:href="@{/ingresos}">Ingresos</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'facturas'} ? 'active'"
                                        th:href="@{/facturas}">Facturas</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'productos'} ? 'active'"
                                        th:href="@{/productos}">Productos</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'categorias'} ? 'active'"
                                        th:href="@{/categorias}">Categorías</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <span class="navbar-text small text-white-50" th:text="${usuarioCorreo}">usuario</span>
                <form method="post" th:action="@{/logout}" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-light">Salir</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Mensajes que llegan despues de crear, editar o borrar -->
<div th:fragment="mensajes">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensaje}">Listo</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

</body>
</html>
